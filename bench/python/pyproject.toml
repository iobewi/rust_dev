[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iobewi-bench"
version = "0.1.0"
description = "Python API client and pytest fixtures for the IOBEWI hardware bench"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
pytest = ["pytest>=8,<10"]

[project.entry-points.pytest11]
iobewi_bench = "iobewi_bench.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]
