name: Devcontainer validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: devcontainer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @devcontainers/cli@0.90.0
      - name: Build and start devcontainer
        run: devcontainer up --workspace-folder .
      - name: Verify installed tools
        run: devcontainer exec --workspace-folder . rust-dev-smoke
