name: Devcontainer validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @devcontainers/cli@0.90.0
      - name: Build and open devcontainer
        run: devcontainer up --workspace-folder . > /tmp/devcontainer-up.json
      - name: Toolchain smoke tests
        run: devcontainer exec --workspace-folder . rust-dev-smoke
      - name: Record workspace and Claude volume sentinels
        run: |
          devcontainer exec --workspace-folder . bash -c 'echo workspace > /workspace/.ci-sentinel; echo claude > /root/.claude/.ci-sentinel'
      - name: Recreate container
        run: |
          docker rm --force "$(jq -er '.containerId' /tmp/devcontainer-up.json)"
          devcontainer up --workspace-folder . > /tmp/devcontainer-up.json
      - name: Verify persistence
        run: |
          devcontainer exec --workspace-folder . bash -c 'test "$(cat /workspace/.ci-sentinel)" = workspace && test "$(cat /root/.claude/.ci-sentinel)" = claude'
          devcontainer exec --workspace-folder . rust-dev-smoke
