name: Generic hardware bench
on:
  pull_request:
    paths: ['bench/**', '.github/workflows/bench.yml', '.devcontainer/**', 'docker/**', 'AGENTS.md']
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e "./python[pytest]"
      - run: python -m pytest python/tests recipes -q --junitxml=/tmp/bench-pytest.xml
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
